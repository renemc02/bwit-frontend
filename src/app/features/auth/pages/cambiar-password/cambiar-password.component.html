<div class="cp-wrap">
  <div class="cp-card">
    <div class="cp-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>
    <h1>Crea tu nueva contraseña</h1>
    <p class="cp-sub">Por seguridad, debes establecer una contraseña propia antes de continuar.</p>

    <div class="cp-field">
      <label>Nueva contraseña</label>
      <div style="position:relative">
        <input [type]="verPass() ? 'text' : 'password'" [(ngModel)]="nueva" name="nueva"
               placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        <button type="button" (click)="verPass.set(!verPass())" class="cp-eye">
          @if (verPass()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
    </div>

    <div class="cp-field">
      <label>Confirmar contraseña</label>
      <input [type]="verPass() ? 'text' : 'password'" [(ngModel)]="confirmar" name="confirmar"
             placeholder="Repite la contraseña" autocomplete="new-password" />
    </div>

    @if (error()) { <div class="cp-error">{{ error() }}</div> }

    <button class="cp-btn" (click)="guardar()" [disabled]="guardando()">
      {{ guardando() ? 'Guardando…' : 'Guardar y continuar' }}
    </button>
  </div>
</div>
